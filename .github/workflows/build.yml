name: Build Shed

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-24.04
            name: Linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Fetch JUCE
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev

      - name: Configure (macOS universal)
        if: runner.os == 'macOS'
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Configure (Windows, static runtime)
        if: runner.os == 'Windows'
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSHED_JACK=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=build/Shed_artefacts/Release/Shed.app
          codesign --force --deep -s - "$APP"
          ditto -c -k --keepParent "$APP" Shed-macOS.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/Shed_artefacts/Release/Shed.exe, README.md -DestinationPath Shed-Windows.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf Shed-Linux-x86_64.tar.gz -C build/Shed_artefacts/Release Shed

      - uses: actions/upload-artifact@v4
        with:
          name: Shed-${{ matrix.name }}
          path: |
            Shed-*.zip
            Shed-*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
